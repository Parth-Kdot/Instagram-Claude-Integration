<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reels Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #host { position: absolute; inset: 0; }
    #host iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .rsfc-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.55); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <div id="host"><div class="rsfc-loading">Loading…</div></div>
  <script src="player.js"></script>
</body>
</html>
